# E2E test: back up seeded `source` DB to local minio, restore into empty `target` DB.
#
# Usage:
#   docker compose -f docker-compose.test.yaml up -d --build source target minio minio-setup
#   docker compose -f docker-compose.test.yaml run --rm backup
#   docker compose -f docker-compose.test.yaml run --rm restore
#   docker compose -f docker-compose.test.yaml down -v

services:
  source:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: source_db
    volumes:
      - ./test/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d source_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  target:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: target_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d target_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/test-bucket &&
      echo 'bucket ready'
      "

  backup:
    build:
      context: .
      args:
        POSTGRES_VERSION: '18'
    depends_on:
      source:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      SCHEDULE: ''           # run once and exit
      PASSPHRASE: testpass
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: test-bucket
      S3_PREFIX: backup
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: source
      POSTGRES_DATABASE: source_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  restore:
    build:
      context: .
      args:
        POSTGRES_VERSION: '18'
    depends_on:
      target:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      SCHEDULE: ''
      PASSPHRASE: testpass
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: test-bucket
      S3_PREFIX: backup
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: target
      POSTGRES_DATABASE: target_db
      SOURCE_DATABASE: source_db   # restore "source_db" backup into target_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    entrypoint: ["sh", "restore.sh"]
